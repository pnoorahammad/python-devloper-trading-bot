services:
  trading-api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  trading-cli:
    build: .
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    entrypoint: ["python", "cli.py"]
    profiles:
      - cli
